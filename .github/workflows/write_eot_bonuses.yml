name: Write EOT Bonuses

on:
  workflow_dispatch:

jobs:
  write-eot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Write EOT bonuses to Firebase
        env:
          FIREBASE_ADMIN_SDK_JSON: ${{ secrets.FIREBASE_ADMIN_SDK_JSON }}
          FIREBASE_DB_URL: https://wc2026-fantasy-m47-default-rtdb.firebaseio.com
        run: python write_eot_bonuses.py
