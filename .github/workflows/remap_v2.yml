name: Remap R32 Match IDs V2
on:
  workflow_dispatch:
jobs:
  remap-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run R32 ID remap V2
        env:
          FIREBASE_ADMIN_SDK_JSON: ${{ secrets.FIREBASE_ADMIN_SDK_JSON }}
          FIREBASE_DB_URL: https://wc2026-fantasy-m47-default-rtdb.firebaseio.com
        run: python patch_r32_id_remap_v2.py
