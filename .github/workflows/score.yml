name: WC 2026 Fantasy Scorer

on:
  # Run every 5 min during match hours (13:00–04:00 UTC covers all kick-off windows)
  schedule:
    - cron: "*/5 13-23 * * *"
    - cron: "*/5 0-4 * * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scorer
        env:
          FIREBASE_ADMIN_SDK_JSON: ${{ secrets.FIREBASE_ADMIN_SDK_JSON }}
          FIREBASE_DB_URL: https://wc2026-fantasy-m47-default-rtdb.firebaseio.com
        run: python scorer.py
